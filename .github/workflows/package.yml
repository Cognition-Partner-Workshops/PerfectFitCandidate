name: Package Windows portable ZIP

on:
  pull_request:
    paths:
      - "PFC/packaging/**"
      - ".github/workflows/package.yml"
      - "PFC/app/pyproject.toml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packaging test tools
        run: python -m pip install pytest ruff

      - name: Test packaging helpers
        run: python -m pytest PFC/packaging/tests

      - name: Lint packaging tools
        run: ruff check --config PFC/app/pyproject.toml PFC/packaging

      - name: Check packaging formatting
        run: ruff format --check --config PFC/app/pyproject.toml PFC/packaging

      - name: Build portable ZIP
        run: python PFC/packaging/build_zip.py --out PFC/packaging/dist

      - name: Extract package for smoke test
        shell: pwsh
        run: |
          $archive = Get-ChildItem "PFC/packaging/dist/PFC-*-win-x64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Package ZIP was not created." }
          $packageDir = Join-Path $env:RUNNER_TEMP "PFC-package"
          Expand-Archive -Path $archive.FullName -DestinationPath $packageDir -Force
          Add-Content -Path $env:GITHUB_ENV -Value "PFC_PACKAGE_DIR=$packageDir"

      - name: Smoke-test bundled Python and native dependencies
        shell: pwsh
        run: |
          & "$env:PFC_PACKAGE_DIR\python\python.exe" -c "import pfc, fastapi, numpy, onnxruntime, sqlite_vec, win32com.client"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PFC_PACKAGE_DIR\llama\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: pfc-windows-x64-portable
          path: PFC/packaging/dist/PFC-*-win-x64.zip
          if-no-files-found: error

  capture-native-logs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pfc-windows-x64-with-models
          run-id: 42206790413
          github-token: ${{ github.token }}
          path: native-artifact
      - name: Extract and capture native output without logging raw content
        shell: pwsh
        run: |
          $root = Join-Path $env:USERPROFILE 'PFC-native-capture'
          Expand-Archive (Get-ChildItem native-artifact/*.zip | Select-Object -First 1).FullName $root
          & "$root/python/python.exe" PFC/packaging/capture_native_logs.py $root native-capture.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrubbed-native-logs-b8936
          path: native-capture.json
          if-no-files-found: error
