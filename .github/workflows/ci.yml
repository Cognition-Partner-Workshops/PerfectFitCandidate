name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: python -m pip install -e "PFC/app[dev]"
      - name: Ruff lint
        run: ruff check pfc tests
        working-directory: PFC/app
      - name: Ruff format
        run: ruff format --check pfc tests
        working-directory: PFC/app
      - name: Mypy
        run: mypy pfc
        working-directory: PFC/app
      - name: Pytest
        run: pytest
        working-directory: PFC/app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PFC/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: PFC/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Playwright 1.54 has no browser build for ubuntu-latest (26.04), so pin 24.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: PFC/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: PFC/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend for e2e
        run: python -m pip install -e ../app
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (real backend + built SPA)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            PFC/frontend/playwright-report
            PFC/frontend/test-results
