[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfc"
version = "0.1.0"
description = "PerfectFitCandidate application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=5.1",
  "argon2-cffi>=23.1",
  "cryptography>=44",
  "sqlite-vec>=0.1.6",
  "numpy>=2.2",
  "onnxruntime>=1.20",
  "tokenizers>=0.21",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "packaging>=24",
  "filelock>=3.16",
  "pyyaml>=6",
  "pywin32>=308; sys_platform == 'win32'",
  "python-multipart>=0.0.20",
]

[project.scripts]
pfc = "pfc.launcher:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6",
  "types-jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pfc*"]

[tool.setuptools.package-data]
"pfc.db.migrations" = ["*.sql"]
"pfc.security" = ["*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pfc.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
